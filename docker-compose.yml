services:
  client:
    image: awaghray/boilerlist-client:latest # Pulled on the server; built+pushed from the laptop
    build:
      context: ./client # Path to your client directory
      dockerfile: client.Dockerfile # Specify the Dockerfile name
    ports:
      - "8090:80" # Host port 8090 -> Nginx (point the Cloudflare tunnel here)
    depends_on:
      - server
    restart: always

  server:
    image: awaghray/boilerlist-server:latest # Pulled on the server; built+pushed from the laptop
    build:
      context: ./server # Path to your server directory
      dockerfile: server.Dockerfile # Specify the Dockerfile name
    env_file:
      - ./server/.env # MONGO_URI, JWT_SECRET, GMAIL_*, GOOGLE_API_KEY, etc.
    environment:
      - PORT=8080
      - CHROMA_URL=http://chroma:8000 # Reach the chroma service over the docker network
    expose:
      - "8080" # Internal only; reached via nginx, not published to the host
    depends_on:
      - chroma
    restart: always

  chroma:
    image: chromadb/chroma:latest
    volumes:
      - ./server/chroma-data:/data # Persist the vector store
    expose:
      - "8000" # Internal only
    restart: always
