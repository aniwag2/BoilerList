# docker-compose.yml
version: '3.8'

services:
  client:
    build:
      context: ./client
      dockerfile: client.Dockerfile
    ports:
      - "3000:80"
    restart: always
  
  api:
    build:
      context: ./server
      dockerfile: server.Dockerfile
    ports:
      - "8089:8089"
    environment:
      # FIX: MONGO_URI now points to your Atlas instance, not a local container
      - MONGO_URI=${MONGO_URI}
      - PORT=8089
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # NEW: Add the ChromaDB URL environment variable
      - CHROMA_URL=http://chroma:8000
    depends_on:
      - chroma # API depends on ChromaDB, but not a local MongoDB
    restart: always

  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chromadb
    volumes:
      - ./chroma-data:/app/chroma
    ports:
      - "8000:8000"
    restart: always