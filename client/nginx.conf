# client/nginx.conf
server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html index.htm;

  # Location for API routes - proxy to the backend service
  # This routes all requests starting with /api/ to the 'api' container
  location /api/ {
    proxy_pass http://api:8089; # FIX: Use service name 'api' and port 8089
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Root location for the single-page application (React)
  location / {
    try_files $uri $uri/ /index.html;
  }
}